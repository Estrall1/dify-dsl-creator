app:
  description: HTTP 请求工作流示例
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: HTTP 请求示例
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 外部接口地址
    id: 11111111-1111-4111-8111-111111111111
    name: API_BASE_URL
    selector:
    - env
    - API_BASE_URL
    value: https://api.example.com
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: edge-start-http
      source: '1730000000301'
      sourceHandle: source
      target: '1730000000302'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: edge-http-code
      source: '1730000000302'
      sourceHandle: source
      target: '1730000000303'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
      id: edge-code-end
      source: '1730000000303'
      sourceHandle: source
      target: '1730000000304'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 用户问题
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: query
      height: 90
      id: '1730000000301'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: query
            type: text
            value: '{{#1730000000301.query#}}'
          type: json
        desc: ''
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 10
        title: 调用外部接口
        type: http-request
        url: '{{#env.API_BASE_URL#}}/v1/answer'
        variables: []
      height: 98
      id: '1730000000302'
      position:
        x: 430
        y: 282
      positionAbsolute:
        x: 430
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          def main(response: str) -> dict:
              return {"result": response}
        code_language: python3
        desc: ''
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 整理响应
        type: code
        variables:
        - value_selector:
          - '1730000000302'
          - body
          variable: response
      height: 98
      id: '1730000000303'
      position:
        x: 780
        y: 282
      positionAbsolute:
        x: 780
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1730000000303'
          - result
          variable: result
        selected: false
        title: 结束
        type: end
      height: 107
      id: '1730000000304'
      position:
        x: 1130
        y: 282
      positionAbsolute:
        x: 1130
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
