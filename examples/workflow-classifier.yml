app:
  description: 问题分类路由工作流示例
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: 问题分类路由示例
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: question-classifier
      id: edge-start-classifier
      source: '1730000000201'
      sourceHandle: source
      target: '1730000000202'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      id: edge-classifier-product
      source: '1730000000202'
      sourceHandle: '1'
      target: '1730000000203'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      id: edge-classifier-support
      source: '1730000000202'
      sourceHandle: '2'
      target: '1730000000204'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: variable-aggregator
      id: edge-product-aggregator
      source: '1730000000203'
      sourceHandle: source
      target: '1730000000205'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: variable-aggregator
      id: edge-support-aggregator
      source: '1730000000204'
      sourceHandle: source
      target: '1730000000205'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: variable-aggregator
        targetType: end
      id: edge-aggregator-end
      source: '1730000000205'
      sourceHandle: source
      target: '1730000000206'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 用户问题
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: query
      height: 90
      id: '1730000000201'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        classes:
        - id: '1'
          name: 产品咨询
        - id: '2'
          name: 售后服务
        desc: ''
        instruction: 请根据用户问题判断它属于产品咨询还是售后服务。
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: gpt-4o-mini
          provider: openai
        query_variable_selector:
        - '1730000000201'
        - query
        selected: false
        title: 问题分类
        type: question-classifier
      height: 98
      id: '1730000000202'
      position:
        x: 430
        y: 282
      positionAbsolute:
        x: 430
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.5
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: 你是产品顾问，请回答产品功能、价格和适用场景相关问题。
        - role: user
          text: '{{#1730000000201.query#}}'
        selected: false
        title: 产品咨询回复
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1730000000203'
      position:
        x: 780
        y: 162
      positionAbsolute:
        x: 780
        y: 162
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.5
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - role: system
          text: 你是售后支持人员，请回答退换货、故障排查和投诉相关问题。
        - role: user
          text: '{{#1730000000201.query#}}'
        selected: false
        title: 售后回复
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1730000000204'
      position:
        x: 780
        y: 402
      positionAbsolute:
        x: 780
        y: 402
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        output_type: string
        selected: false
        title: 变量聚合
        type: variable-aggregator
        variables:
        - - '1730000000203'
          - text
        - - '1730000000204'
          - text
      height: 98
      id: '1730000000205'
      position:
        x: 1130
        y: 282
      positionAbsolute:
        x: 1130
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1730000000205'
          - output
          variable: result
        selected: false
        title: 结束
        type: end
      height: 107
      id: '1730000000206'
      position:
        x: 1480
        y: 282
      positionAbsolute:
        x: 1480
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
