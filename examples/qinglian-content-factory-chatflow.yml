    - data:
        type: code
        title: 短视频检查
        desc: ''
        selected: false
        code_language: python3
        code: |
          def main(text: str, target_length: float = 300) -> dict:
              text = text or ""
              target = int(float(target_length or 300))
              length = len("".join(text.split()))
              lines = [line for line in text.splitlines() if line.strip()]
              reasons = []
              if length < max(100, int(target * 0.5)):
                  reasons.append("脚本偏短，当前约 %d 字" % length)
              if length > int(target * 1.8):
                  reasons.append("脚本偏长，当前约 %d 字" % length)
              if len(lines) < 3:
                  reasons.append("分镜或段落少于 3 段")
              status = "revise" if reasons else "ok"
              reason = "；".join(reasons) if reasons else "字数和分镜结构符合要求"
              return {"status": status, "reason": reason, "word_count": length}
        variables:
        - variable: text
          value_selector:
          - video_script
          - text
        - variable: target_length
          value_selector:
          - extract_params
          - length
        outputs:
          status:
            type: string
            children: null
          reason:
            type: string
            children: null
          word_count:
            type: number
            children: null
