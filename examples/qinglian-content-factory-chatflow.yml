          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: 你是资深小红书内容策划，擅长写出有网感、可读性强的爆款笔记。
        - role: user
          text: |-
            请根据以下信息创作一篇小红书笔记。
            主题：{{#extract_params.topic#}}
            目标受众：{{#extract_params.audience#}}
            语气风格：{{#extract_params.tone#}}
            目标字数：{{#extract_params.length#}}
            用户原始需求：{{#sys.query#}}

            要求：
            1. 输出标题、正文和至少 3 个话题标签。
            2. 标题要有吸引力，正文分段清晰，适当使用 emoji。
            3. 不要输出解释，只输出可直接发布的文案。
        variables: []
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      height: 90
      id: xhs_writer
      position:
        x: 980
        y: 42
      positionAbsolute:
        x: 980
        y: 42
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: code
        title: 小红书检查
        desc: ''
        selected: false
        code_language: python3
        code: |
          def main(text: str, target_length: float = 300) -> dict:
              text = text or ""
              target = int(float(target_length or 300))
              length = len("".join(text.split()))
              tags = []
              for line in text.splitlines():
                  tags.extend(part for part in line.split() if part.startswith("#"))
              reasons = []
              if length < max(120, int(target * 0.6)):
                  reasons.append("正文偏短，当前约 %d 字" % length)
              if length > int(target * 1.8):
                  reasons.append("正文偏长，当前约 %d 字" % length)
              if len(tags) < 3:
                  reasons.append("话题标签少于 3 个")
              status = "revise" if reasons else "ok"
              reason = "；".join(reasons) if reasons else "字数和标签符合要求"
              return {"status": status, "reason": reason, "word_count": length}
        variables:
        - variable: text
          value_selector:
          - xhs_writer
          - text
        - variable: target_length
          value_selector:
          - extract_params
          - length
        outputs:
          status:
            type: string
            children: null
          reason:
            type: string
            children: null
          word_count:
            type: number
            children: null
      height: 130
      id: xhs_check
      position:
        x: 1280
        y: 42
      positionAbsolute:
        x: 1280
        y: 42
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: if-else
        title: 小红书是否修改
        desc: ''
        selected: false
        cases:
        - case_id: revise
          logical_operator: and
          conditions:
          - id: xhs_if-status
            comparison_operator: is
            value: revise
            varType: string
            variable_selector:
            - xhs_check
            - status
